<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual-viewport" name="viewport"/>
<title>Deca-Node | TSP Optimization Engine</title>
<meta name="description" content="Deca-Node: Real-time delivery route optimization using GraphHopper and jsprit TSP solver"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<link rel="stylesheet" href="/css/tailwind.css">
<script src="https://unpkg.com/htmx.org@1.9.10"></script>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .htmx-indicator {
        display: none;
    }
    /* Skeleton loader shown during HTMX request */
    .htmx-request .htmx-indicator { display: block; }
    .htmx-request.htmx-indicator  { display: block; }
    /* Leaflet z-index fix */
    #map { z-index: 0; }
    .leaflet-pane { z-index: 1; }
    /* Custom marker pulse animation */
    @keyframes markerPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(26, 115, 232, 0.5); }
        50% { box-shadow: 0 0 0 12px rgba(26, 115, 232, 0); }
    }
    /* Stop list item styles */
    .stop-item {
        animation: slideIn 0.25s ease-out;
    }
    @keyframes slideIn {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
    }
    /* Optimized route polyline glow (via Leaflet pane layering) */
    .leaflet-overlay-pane svg path {
        filter: drop-shadow(0 0 4px rgba(26, 115, 232, 0.4));
    }
    /* Scrollbar styling for sidebar */
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #c1c6d6; border-radius: 999px; }
    /* ── Mobile keyboard: keep bottom-sheet anchored to visual viewport ── */
    @media (max-width: 767px) {
        #bottom-sheet {
            /* transition handles both transform-based snap AND keyboard repositioning */
            transition: transform 0.3s ease-out, bottom 0.15s ease-out;
        }
    }
</style>
</head>
<body class="bg-background font-body text-on-surface antialiased overflow-hidden">

<!-- ── Anti-FOUC Initial Loader ──────────────────────────────── -->
<!-- Pure inline styles so this works BEFORE tailwind.css arrives -->
<div id="initial-loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#f3f4f6;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
    <!-- Animated spinner (inline SVG, no external deps) -->
    <svg style="animation:spin 0.9s linear infinite;width:44px;height:44px;" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="22" r="18" stroke="#e5e7eb" stroke-width="4"/>
        <path d="M40 22a18 18 0 0 0-18-18" stroke="#005bbf" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <p style="font-family:sans-serif;font-size:13px;color:#6b7280;letter-spacing:0.05em;">Loading Deca-Node&hellip;</p>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>
<script>window.addEventListener('load',function(){var l=document.getElementById('initial-loader');if(l)l.style.display='none';});</script>

<!-- ── Leaflet Map (full-screen background) ──────────────────── -->
<div class="fixed inset-0 z-0 w-screen h-screen" id="map"></div>

<!-- Mobile Hamburger Menu Button -->
<button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('map-overlay').classList.toggle('hidden');" class="md:hidden fixed top-4 left-4 z-30 p-2 bg-white rounded-xl shadow-lg hover:bg-gray-50 text-slate-800 transition-colors">
   <span class="material-symbols-outlined">menu</span>
</button>

<!-- Mobile Overlay -->
<div id="map-overlay" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden transition-opacity" onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full'); this.classList.toggle('hidden');"></div>

<!-- ── Left Sidebar (Drawer on Mobile, Panel on Desktop) ──────── -->
<aside id="sidebar" class="fixed left-0 top-0 z-50 flex flex-col bg-white dark:bg-slate-900 md:rounded-3xl h-full md:h-[calc(100vh-2rem)] w-[80wv] max-w-sm md:w-72 md:m-4 shadow-2xl font-plus-jakarta-sans text-sm transition-transform duration-300 transform -translate-x-full md:translate-x-0 no-scrollbar overflow-y-auto">
    <div class="p-6">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 bg-primary-container rounded-xl flex items-center justify-center text-white">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">route</span>
            </div>
            <div class="flex-1">
                <h1 class="text-lg font-bold text-slate-900 dark:text-slate-50 leading-tight">Deca-Node TSP</h1>
                <p class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Optimization Engine</p>
            </div>
            <!-- Mobile Close Button inside Drawer -->
            <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('map-overlay').classList.toggle('hidden');" class="md:hidden w-8 h-8 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-lg">
                <span class="material-symbols-outlined text-xl">close</span>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="space-y-1">
            <!--
              Route Builder button behaviour:
              - Desktop: toggles #bottom-sheet (the main content panel) collapsed/expanded
              - Mobile:  also closes the sidebar drawer + overlay (since on mobile the
                         sidebar is a full-screen drawer that overlaps everything)
              The sidebar itself (#sidebar) is NOT toggled on desktop.
            -->
            <button type="button" id="btn-route-builder" class="w-full flex items-center gap-3 px-4 py-2.5 bg-primary-fixed/50 text-primary rounded-xl font-semibold text-sm hover:bg-primary-fixed/80 transition-colors">
                <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">conversion_path</span>
                Route Builder
            </button>
        </nav>
    </div>

    <!-- Sidebar footer -->
    <div class="mt-auto p-6 border-t border-surface-variant">
        <a href="https://github.com/sethum-VS/Deca-Node-TSP" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 px-4 py-2.5 text-on-surface-variant hover:bg-surface-container-low rounded-xl transition-colors text-sm">
            <span class="material-symbols-outlined text-lg">help</span>
            Support
        </a>
    </div>
</aside>

<!-- ── Main Panel (Bottom Sheet on Mobile, Floating on Desktop) ── -->
<main id="bottom-sheet" class="fixed bottom-0 md:top-0 left-0 md:left-80 z-20 w-full md:w-96 max-h-[50vh] md:max-h-[calc(100vh-2rem)] md:m-4 overflow-y-auto no-scrollbar transition-transform duration-300 ease-out bg-white md:bg-surface-container-lowest/95 backdrop-blur-md rounded-t-3xl md:rounded-xl shadow-[0_-4px_25px_rgba(0,0,0,0.15)] md:shadow-2xl md:border md:border-white/20">

    <!-- ── Expanded touch zone: pill + title + search bar ──────── -->
    <!-- touch-none prevents native browser scroll-handling on this strip -->
    <div id="sheet-drag-header" class="touch-none cursor-grab select-none px-5 pt-3 pb-4 md:cursor-auto md:touch-auto">
        <!-- Drag pill (mobile only) -->
        <div class="w-16 h-1.5 bg-outline-variant/60 rounded-full mx-auto mb-3 md:hidden"></div>

        <!-- Title -->
        <div class="flex items-center justify-between mb-4">
            <h2 class="font-headline text-xl font-extrabold tracking-tight text-on-surface">Deca-Node TSP Solver</h2>
        </div>

        <!-- Search bar (for address geocoding) -->
        <div class="relative group">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 group-focus-within:text-primary transition-colors">search</span>
            <input id="search-input" class="w-full h-12 pl-12 pr-4 bg-surface-container-lowest border-none rounded-xl shadow-sm ring-1 ring-outline-variant/30 focus:ring-2 focus:ring-primary focus:shadow-md transition-all placeholder:text-on-surface-variant/50 text-sm" placeholder="Search for a location..." type="text"/>
        </div>
    </div>
    <!-- Everything below retains normal overflow-y-auto scroll behaviour -->
    <div class="px-5 pb-5 flex flex-col gap-5"><!-- scrollable content -->

        <!-- Form with HTMX -->
        <form id="route-form" class="space-y-6" hx-post="/route" hx-target="#results-container" hx-indicator="#loading-skeleton">
            <div class="space-y-3">
                <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">location_on</span>
                    Waypoint Sequence
                </label>
                <ul class="flex flex-col gap-2 p-4 bg-surface-container-low rounded-xl min-h-[120px] transition-all border-2 border-dashed border-outline-variant/30 no-scrollbar overflow-y-auto max-h-[40vh]" id="stop-list">
                    <li class="flex flex-col items-center justify-center h-full text-center py-6 text-on-surface-variant/60" id="empty-state">
                        <span class="material-symbols-outlined text-3xl mb-2">add_location_alt</span>
                        <p class="text-sm px-4">Click on the map or search to drop up to 10 route stops.</p>
                    </li>
                </ul>
            </div>

            <div class="space-y-3">
                <button class="group relative w-full h-12 bg-gradient-to-br from-primary to-primary-container text-white font-semibold rounded-lg overflow-hidden flex items-center justify-center transition-all active:scale-[0.98] shadow-lg shadow-primary/20" type="submit" id="btn-optimize">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-xl">rocket_launch</span>
                        <span>Optimize Route</span>
                    </div>
                </button>

                <button class="w-full h-11 border-2 border-outline-variant/50 text-on-surface-variant font-medium rounded-lg hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2" type="button" id="clear-pins-btn">
                    <span class="material-symbols-outlined text-lg">delete_sweep</span>
                    Clear Pins
                </button>
            </div>
        </form>

        <!-- ── HTMX Skeleton Loader (visible during hx-request) ─────── -->
        <div id="loading-skeleton" class="htmx-indicator mt-4 space-y-3">
            <div class="h-4 w-1/3 bg-gray-200 rounded-full animate-pulse"></div>
            <div class="flex items-center gap-3 p-3 bg-gray-100 rounded-xl animate-pulse">
                <div class="w-7 h-7 rounded-full bg-gray-300 shrink-0"></div>
                <div class="flex-1 space-y-1.5">
                    <div class="h-3 bg-gray-300 rounded-full w-3/4"></div>
                    <div class="h-2.5 bg-gray-200 rounded-full w-1/2"></div>
                </div>
            </div>
            <div class="flex items-center gap-3 p-3 bg-gray-100 rounded-xl animate-pulse">
                <div class="w-7 h-7 rounded-full bg-gray-300 shrink-0"></div>
                <div class="flex-1 space-y-1.5">
                    <div class="h-3 bg-gray-300 rounded-full w-2/3"></div>
                    <div class="h-2.5 bg-gray-200 rounded-full w-2/5"></div>
                </div>
            </div>
            <div class="flex items-center gap-3 p-3 bg-gray-100 rounded-xl animate-pulse">
                <div class="w-7 h-7 rounded-full bg-gray-300 shrink-0"></div>
                <div class="flex-1 space-y-1.5">
                    <div class="h-3 bg-gray-300 rounded-full w-4/5"></div>
                    <div class="h-2.5 bg-gray-200 rounded-full w-1/3"></div>
                </div>
            </div>
        </div>

        <!-- Results container (HTMX swaps content here) -->
        <div class="mt-2 border-t border-surface-variant pt-6 hidden transition-all" id="results-container">
        </div>
    </div><!-- /scrollable content -->
</main>

<!-- ═══════════════════════════════════════════════════════════════
     Vanilla JS — Leaflet Map Controller
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function() {
    'use strict';

    // ── Constants ──────────────────────────────────────────────
    const MAX_STOPS = 10;
    const COLOMBO = [6.9271, 79.8612];
    const DEFAULT_ZOOM = 8;
    const TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const TILE_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';

    // ── State ──────────────────────────────────────────────────
    let markers = [];
    let stopCount = 0;
    let routePolyline = null;
    let optimizedMarkers = [];

    // ── Initialize Map ─────────────────────────────────────────
    const map = L.map('map', {
        center: COLOMBO,
        zoom: DEFAULT_ZOOM,
        zoomControl: false
    });

    L.tileLayer(TILE_URL, {
        attribution: TILE_ATTR,
        maxZoom: 19
    }).addTo(map);

    // Position zoom control on right side
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ── DOM References ─────────────────────────────────────────
    const stopList     = document.getElementById('stop-list');
    const emptyState   = document.getElementById('empty-state');
    const clearBtn     = document.getElementById('clear-pins-btn');
    const resultsDiv   = document.getElementById('results-container');
    const searchInput  = document.getElementById('search-input');

    // ── Custom marker icon ─────────────────────────────────────
    function createMarkerIcon(number) {
        return L.divIcon({
            className: 'custom-marker',
            html: `<div style="
                width: 32px; height: 32px;
                background: linear-gradient(135deg, #005bbf, #1a73e8);
                border: 3px solid #fff;
                border-radius: 50%;
                display: flex; align-items: center; justify-content: center;
                color: #fff; font-weight: 700; font-size: 13px;
                font-family: 'Inter', sans-serif;
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                animation: markerPulse 2s ease-in-out 1;
            ">${number}</div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });
    }

    // Optimized route marker (green)
    function createOptimizedIcon(number) {
        return L.divIcon({
            className: 'custom-marker',
            html: `<div style="
                width: 32px; height: 32px;
                background: linear-gradient(135deg, #0f9d58, #34a853);
                border: 3px solid #fff;
                border-radius: 50%;
                display: flex; align-items: center; justify-content: center;
                color: #fff; font-weight: 700; font-size: 13px;
                font-family: 'Inter', sans-serif;
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            ">${number}</div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });
    }

    // ── Add Stop ───────────────────────────────────────────────
    function addStop(lat, lng, label) {
        if (stopCount >= MAX_STOPS) return;

        stopCount++;
        const coordStr = lat.toFixed(6) + ', ' + lng.toFixed(6);
        const displayLabel = label || coordStr;

        // Hide empty state
        emptyState.style.display = 'none';

        // Drop marker on map
        const marker = L.marker([lat, lng], {
            icon: createMarkerIcon(stopCount)
        }).addTo(map);
        marker.bindPopup(`<b>Stop ${stopCount}</b><br>${displayLabel}`);
        markers.push(marker);

        // Create list item + hidden input
        const li = document.createElement('li');
        li.className = 'stop-item flex items-center gap-3 py-2 px-3 bg-white rounded-lg shadow-sm border border-outline-variant/20';
        li.innerHTML = `
            <div class="flex items-center justify-center w-7 h-7 rounded-full bg-primary text-white text-xs font-bold shrink-0">${stopCount}</div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-on-surface truncate">${displayLabel}</p>
                <p class="text-[11px] text-on-surface-variant">${coordStr}</p>
            </div>
            <button type="button" class="remove-stop shrink-0 w-7 h-7 flex items-center justify-center text-on-surface-variant/50 hover:text-error hover:bg-error-container rounded-full transition-colors" data-index="${stopCount - 1}">
                <span class="material-symbols-outlined text-base">close</span>
            </button>
            <input type="hidden" name="stop" value="${coordStr}"/>
        `;
        stopList.appendChild(li);

        // Remove stop handler
        li.querySelector('.remove-stop').addEventListener('click', function() {
            removeStop(parseInt(this.dataset.index));
        });
    }

    // ── Remove Stop ────────────────────────────────────────────
    function removeStop(index) {
        // Remove marker from map
        if (markers[index]) {
            map.removeLayer(markers[index]);
        }
        markers.splice(index, 1);
        stopCount--;

        // Rebuild the list
        rebuildStopList();
        clearRoute();
    }

    // ── Rebuild Stop List (after removal) ──────────────────────
    function rebuildStopList() {
        // Remove all stop items (keep empty state)
        const items = stopList.querySelectorAll('.stop-item');
        items.forEach(item => item.remove());

        if (markers.length === 0) {
            emptyState.style.display = 'flex';
            return;
        }

        // Re-add all stops with updated numbering
        markers.forEach((marker, i) => {
            const latlng = marker.getLatLng();
            marker.setIcon(createMarkerIcon(i + 1));
            marker.setPopupContent(`<b>Stop ${i + 1}</b><br>${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`);

            const coordStr = latlng.lat.toFixed(6) + ', ' + latlng.lng.toFixed(6);
            const li = document.createElement('li');
            li.className = 'stop-item flex items-center gap-3 py-2 px-3 bg-white rounded-lg shadow-sm border border-outline-variant/20';
            li.innerHTML = `
                <div class="flex items-center justify-center w-7 h-7 rounded-full bg-primary text-white text-xs font-bold shrink-0">${i + 1}</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-on-surface truncate">${coordStr}</p>
                    <p class="text-[11px] text-on-surface-variant">${coordStr}</p>
                </div>
                <button type="button" class="remove-stop shrink-0 w-7 h-7 flex items-center justify-center text-on-surface-variant/50 hover:text-error hover:bg-error-container rounded-full transition-colors" data-index="${i}">
                    <span class="material-symbols-outlined text-base">close</span>
                </button>
                <input type="hidden" name="stop" value="${coordStr}"/>
            `;
            stopList.appendChild(li);

            li.querySelector('.remove-stop').addEventListener('click', function() {
                removeStop(parseInt(this.dataset.index));
            });
        });
    }

    // ── Map Click Listener ─────────────────────────────────────
    map.on('click', function(e) {
        if (stopCount >= MAX_STOPS) return;
        addStop(e.latlng.lat, e.latlng.lng);
    });

    // ── Clear Button ───────────────────────────────────────────
    clearBtn.addEventListener('click', function() {
        // Remove all markers
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        stopCount = 0;

        // Clear route
        clearRoute();

        // Reset stop list
        const items = stopList.querySelectorAll('.stop-item');
        items.forEach(item => item.remove());
        emptyState.style.display = 'flex';

        // Hide results
        resultsDiv.classList.add('hidden');
        resultsDiv.innerHTML = '';
    });

    // ── Clear Route Drawing ────────────────────────────────────
    function clearRoute() {
        if (routePolyline) {
            map.removeLayer(routePolyline);
            routePolyline = null;
        }
        optimizedMarkers.forEach(m => map.removeLayer(m));
        optimizedMarkers = [];
    }

    // ── Draw Optimized Route (called by backend response) ─────
    window.drawOptimizedRoute = function(routeData, geometry) {
        clearRoute();

        if (!routeData || routeData.length === 0) return;

        // Remove original blue markers
        markers.forEach(m => map.removeLayer(m));

        // Draw green optimized markers at stop coordinates
        const stopLatLngs = [];
        routeData.forEach(function(point, i) {
            const ll = [point.lat, point.lng];
            stopLatLngs.push(ll);

            const marker = L.marker(ll, {
                icon: createOptimizedIcon(i + 1)
            }).addTo(map);

            const label = point.label || ('Stop ' + (i + 1));
            marker.bindPopup(`<b>#${i + 1} — ${label}</b><br>${point.lat.toFixed(6)}, ${point.lng.toFixed(6)}`);
            optimizedMarkers.push(marker);
        });

        // Determine polyline path: use detailed road geometry if available,
        // otherwise fall back to straight lines between stops
        let polylinePath;
        if (geometry && geometry.length > 0) {
            // geometry is an array of [lat, lng] pairs from GraphHopper
            polylinePath = geometry.map(function(pt) { return [pt[0], pt[1]]; });
        } else {
            polylinePath = stopLatLngs;
        }

        // Draw main polyline (road path)
        routePolyline = L.polyline(polylinePath, {
            color: '#1a73e8',
            weight: 5,
            opacity: 0.85,
            smoothFactor: 1,
            lineCap: 'round',
            lineJoin: 'round'
        }).addTo(map);

        // Add animated direction arrows via a dashed overlay
        L.polyline(polylinePath, {
            color: '#ffffff',
            weight: 2,
            opacity: 0.5,
            dashArray: '10, 20',
            smoothFactor: 1
        }).addTo(map);

        // Fit map bounds to the route
        const bounds = L.latLngBounds(polylinePath);
        map.fitBounds(bounds, { padding: [60, 60] });

        // Show results container
        resultsDiv.classList.remove('hidden');
    };

    // ── Search Input (geocode via Photon) ──────────────────────
    let searchTimeout = null;
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;
            if (stopCount >= MAX_STOPS) return;

            geocodeAndAdd(query);
        }
    });

    function geocodeAndAdd(query) {
        const url = 'https://photon.komoot.io/api/?q=' + encodeURIComponent(query) + '&limit=1';
        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.features && data.features.length > 0) {
                    const coords = data.features[0].geometry.coordinates;
                    const lng = coords[0];
                    const lat = coords[1];
                    const name = data.features[0].properties.name || query;
                    addStop(lat, lng, name);
                    searchInput.value = '';
                    map.setView([lat, lng], 12);
                } else {
                    alert('Location not found: ' + query);
                }
            })
            .catch(err => {
                console.error('Geocoding error:', err);
                alert('Geocoding failed. Check your connection.');
            });
    }

    // ── HTMX: Show results container after swap ────────────────
    document.body.addEventListener('htmx:afterSwap', function(e) {
        if (e.detail.target.id === 'results-container') {
            resultsDiv.classList.remove('hidden');
        }
    });

    // ── Mobile: expand sheet and scroll skeleton into view on optimize ─
    document.body.addEventListener('htmx:beforeRequest', function(e) {
        if (window.innerWidth >= 768) return; // desktop only needs the indicator
        var sheet = document.getElementById('bottom-sheet');
        var skeleton = document.getElementById('loading-skeleton');
        if (!sheet || !skeleton) return;
        // Snap sheet back to full height so the skeleton is visible
        sheet.style.transition = 'transform 0.3s ease-out';
        sheet.style.transform = 'translateY(0)';
        // Small delay so the sheet expands before we scroll
        setTimeout(function() { skeleton.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 350);
    });

})();
</script>

<!-- ═══════════════════════════════════════════════════════════════
     Vanilla JS — Route Builder toggle + Mobile keyboard fix
     Covers: Android Chrome (visualViewport) + iOS Safari (focus/blur fallback)
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function () {
    'use strict';

    // ── Route Builder button: toggles #bottom-sheet on desktop ────
    var btnRouteBuilder = document.getElementById('btn-route-builder');
    var bottomSheet     = document.getElementById('bottom-sheet');
    var sidebar         = document.getElementById('sidebar');
    var mapOverlay      = document.getElementById('map-overlay');

    if (btnRouteBuilder && bottomSheet) {
        btnRouteBuilder.addEventListener('click', function () {
            bottomSheet.classList.toggle('hidden');
            if (window.innerWidth < 768) {
                if (sidebar)    sidebar.classList.add('-translate-x-full');
                if (mapOverlay) mapOverlay.classList.add('hidden');
            }
        });
    }

    // ══════════════════════════════════════════════════════════════
    // Mobile keyboard: anchor #bottom-sheet above the keyboard
    // Strategy:
    //   Primary  → visualViewport 'resize' event (Android + iOS 15.4+)
    //   Fallback → focus/blur on the search input (iOS Safari < 15.4)
    //
    // Key formula: keyboard height = window.innerHeight - vv.height
    //   We intentionally skip vv.offsetTop because on Android's first
    //   resize event offsetTop is temporarily wrong and causes the jump.
    //
    // We use requestAnimationFrame so our DOM write runs AFTER the
    // browser finishes its own layout pass (prevents the first-tap jump).
    // ══════════════════════════════════════════════════════════════
    if (window.innerWidth >= 768) return; // desktop: nothing to do

    var sheet       = document.getElementById('bottom-sheet');
    var searchInput = document.getElementById('search-input');
    if (!sheet) return;

    var rafPending     = false;  // rAF debounce flag
    var lastKbHeight   = 0;      // track last applied keyboard height
    var kbOpenByFocus  = false;  // iOS fallback: did we open via focus?

    // ── Core apply function ── called inside rAF callback ─────────
    function applyKeyboardOffset(kbHeight) {
        if (kbHeight === lastKbHeight) return;  // no change, skip
        lastKbHeight = kbHeight;

        if (kbHeight > 50) {
            // Keyboard open: lift the sheet above it
            sheet.style.transition = 'bottom 0.12s ease-out';
            sheet.style.bottom     = kbHeight + 'px';
        } else {
            // Keyboard closed: return to pinned bottom
            sheet.style.transition = 'bottom 0.2s ease-out';
            sheet.style.bottom     = '0px';
        }
    }

    // ── visualViewport handler (primary — Android Chrome + modern iOS) ──
    if (window.visualViewport) {
        function scheduleViewportUpdate() {
            if (rafPending) return;          // already have a frame queued
            rafPending = true;
            requestAnimationFrame(function () {
                rafPending = false;
                var vv = window.visualViewport;
                // Do NOT include vv.offsetTop — it misfires on Android first tap
                var kbHeight = Math.round(Math.max(0, window.innerHeight - vv.height));
                applyKeyboardOffset(kbHeight);
            });
        }

        window.visualViewport.addEventListener('resize', scheduleViewportUpdate);
        // 'scroll' fires on iOS when the page shifts under the keyboard
        window.visualViewport.addEventListener('scroll', scheduleViewportUpdate);
    }

    // ── focus/blur fallback (iOS Safari primary path before 15.4) ──
    // iOS Safari sometimes fires visualViewport.resize late/unreliably.
    // We also listen directly to the input so we always get a response.
    if (searchInput) {
        searchInput.addEventListener('focus', function () {
            kbOpenByFocus = true;
            // iOS keyboard animation takes ~300 ms
            setTimeout(function () {
                var vv = window.visualViewport;
                if (!vv) return;
                var kbHeight = Math.round(Math.max(0, window.innerHeight - vv.height));
                // On iOS the height might still be settling; take max of two readings
                if (kbHeight < 50) {
                    // second check after another 200 ms
                    setTimeout(function () {
                        var kbH2 = Math.round(Math.max(0, window.innerHeight - vv.height));
                        applyKeyboardOffset(kbH2);
                    }, 200);
                } else {
                    applyKeyboardOffset(kbHeight);
                }
            }, 300);
        });

        searchInput.addEventListener('blur', function () {
            kbOpenByFocus = false;
            // Small delay — iOS keyboard close animation takes ~250 ms
            setTimeout(function () {
                applyKeyboardOffset(0);
            }, 260);
        });
    }

}());</script>

<!-- ═══════════════════════════════════════════════════════════════
     Vanilla JS — Mobile Bottom Sheet Swipe Gesture
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function () {
    'use strict';

    // Only attach swipe logic on mobile screens (< md breakpoint)
    if (window.innerWidth >= 768) return;

    const sheet      = document.getElementById('bottom-sheet');
    const dragHeader = document.getElementById('sheet-drag-header'); // expanded touch zone
    if (!sheet || !dragHeader) return;

    const SNAP_THRESHOLD = 80;    // px drag-down to trigger minimise
    const MINIMISED_Y    = '35vh'; // translateY when minimised

    let startY     = 0;
    let isDragging = false;
    let minimised  = false;

    dragHeader.addEventListener('touchstart', function (e) {
        // Don't start drag if the user is tapping inside the search input
        if (e.target.id === 'search-input') return;
        startY     = e.touches[0].clientY;
        isDragging = true;
        sheet.style.transition = 'none';
    }, { passive: true });

    dragHeader.addEventListener('touchmove', function (e) {
        if (!isDragging) return;
        const deltaY = e.touches[0].clientY - startY;

        if (!minimised && deltaY > 0) {
            sheet.style.transform = 'translateY(' + deltaY + 'px)';
        } else if (minimised && deltaY < 0) {
            sheet.style.transform = 'translateY(calc(' + MINIMISED_Y + ' + ' + deltaY + 'px))';
        }
    }, { passive: true });

    dragHeader.addEventListener('touchend', function (e) {
        if (!isDragging) return;
        isDragging = false;
        sheet.style.transition = 'transform 0.3s ease-out';

        const deltaY = e.changedTouches[0].clientY - startY;

        if (!minimised && deltaY > SNAP_THRESHOLD) {
            sheet.style.transform = 'translateY(' + MINIMISED_Y + ')';
            minimised = true;
        } else if (minimised && deltaY < -SNAP_THRESHOLD) {
            sheet.style.transform = 'translateY(0)';
            minimised = false;
        } else {
            sheet.style.transform = minimised
                ? 'translateY(' + MINIMISED_Y + ')'
                : 'translateY(0)';
        }
    });
}());
</script>
</body>
</html>
