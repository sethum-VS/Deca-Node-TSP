<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Deca-Node | TSP Optimization Engine</title>
<meta name="description" content="Deca-Node: Real-time delivery route optimization using GraphHopper and jsprit TSP solver"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<link rel="stylesheet" href="/css/tailwind.css">
<script src="https://unpkg.com/htmx.org@1.9.10"></script>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .htmx-indicator {
        display: none;
    }
    .htmx-request.htmx-indicator {
        display: flex;
    }
    .htmx-request .btn-content {
        display: none;
    }
    /* Leaflet z-index fix */
    #map { z-index: 0; }
    .leaflet-pane { z-index: 1; }
    /* Custom marker pulse animation */
    @keyframes markerPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(26, 115, 232, 0.5); }
        50% { box-shadow: 0 0 0 12px rgba(26, 115, 232, 0); }
    }
    /* Stop list item styles */
    .stop-item {
        animation: slideIn 0.25s ease-out;
    }
    @keyframes slideIn {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
    }
    /* Optimized route polyline glow (via Leaflet pane layering) */
    .leaflet-overlay-pane svg path {
        filter: drop-shadow(0 0 4px rgba(26, 115, 232, 0.4));
    }
    /* Scrollbar styling for sidebar */
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #c1c6d6; border-radius: 999px; }
</style>
</head>
<body class="bg-background font-body text-on-surface antialiased overflow-hidden">

<!-- ── Leaflet Map (full-screen background) ──────────────────── -->
<div class="fixed inset-0 z-0 w-screen h-screen" id="map"></div>

<!-- Mobile Hamburger Menu Button -->
<button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('map-overlay').classList.toggle('hidden');" class="md:hidden fixed top-4 left-4 z-30 p-2 bg-white rounded-xl shadow-lg hover:bg-gray-50 text-slate-800 transition-colors">
   <span class="material-symbols-outlined">menu</span>
</button>

<!-- Mobile Overlay -->
<div id="map-overlay" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden transition-opacity" onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full'); this.classList.toggle('hidden');"></div>

<!-- ── Left Sidebar (Drawer on Mobile, Panel on Desktop) ──────── -->
<aside id="sidebar" class="fixed left-0 top-0 z-50 flex flex-col bg-white dark:bg-slate-900 md:rounded-3xl h-full md:h-[calc(100vh-2rem)] w-[80wv] max-w-sm md:w-72 md:m-4 shadow-2xl font-plus-jakarta-sans text-sm transition-transform duration-300 transform -translate-x-full md:translate-x-0 no-scrollbar overflow-y-auto">
    <div class="p-6">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 bg-primary-container rounded-xl flex items-center justify-center text-white">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">route</span>
            </div>
            <div class="flex-1">
                <h1 class="text-lg font-bold text-slate-900 dark:text-slate-50 leading-tight">Deca-Node TSP</h1>
                <p class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Optimization Engine</p>
            </div>
            <!-- Mobile Close Button inside Drawer -->
            <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('map-overlay').classList.toggle('hidden');" class="md:hidden w-8 h-8 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-lg">
                <span class="material-symbols-outlined text-xl">close</span>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="space-y-1">
            <button type="button" onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('map-overlay').classList.add('hidden');" class="w-full flex items-center gap-3 px-4 py-2.5 bg-primary-fixed/50 text-primary rounded-xl font-semibold text-sm hover:bg-primary-fixed/80 transition-colors">
                <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">conversion_path</span>
                Route Builder
            </button>
        </nav>
    </div>

    <!-- Sidebar footer -->
    <div class="mt-auto p-6 border-t border-surface-variant">
        <a href="https://github.com/sethum-VS/Deca-Node-TSP" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 px-4 py-2.5 text-on-surface-variant hover:bg-surface-container-low rounded-xl transition-colors text-sm">
            <span class="material-symbols-outlined text-lg">help</span>
            Support
        </a>
    </div>
</aside>

<!-- ── Main Panel (Bottom Sheet on Mobile, Floating on Desktop) ── -->
<main id="bottom-sheet" class="fixed bottom-0 md:top-0 left-0 md:left-80 z-20 w-full md:w-96 max-h-[50vh] md:max-h-[calc(100vh-2rem)] md:m-4 overflow-y-auto no-scrollbar transition-transform duration-300 ease-out bg-white md:bg-surface-container-lowest/95 backdrop-blur-md rounded-t-3xl md:rounded-xl shadow-[0_-4px_25px_rgba(0,0,0,0.15)] md:shadow-2xl md:border md:border-white/20">
    <!-- Visual drag handle for mobile affordance -->
    <div id="drag-handle" class="w-16 h-1.5 bg-outline-variant/60 rounded-full mx-auto mt-3 mb-1 md:hidden touch-none"></div>
    
    <div class="p-5 md:p-6 flex flex-col gap-5 md:gap-6 h-full">

        <!-- Header -->
        <div class="flex items-center justify-between">
            <h2 class="font-headline text-xl font-extrabold tracking-tight text-on-surface">Deca-Node TSP Solver</h2>
        </div>

        <!-- Search bar (for address geocoding) -->
        <div class="relative group">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 group-focus-within:text-primary transition-colors">search</span>
            <input id="search-input" class="w-full h-12 pl-12 pr-4 bg-surface-container-lowest border-none rounded-xl shadow-sm ring-1 ring-outline-variant/30 focus:ring-2 focus:ring-primary focus:shadow-md transition-all placeholder:text-on-surface-variant/50 text-sm" placeholder="Search for a location..." type="text"/>
        </div>

        <!-- Form with HTMX -->
        <form id="route-form" class="space-y-6" hx-post="/route" hx-target="#results-container" hx-indicator="#loading-skeleton">
            <div class="space-y-3">
                <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">location_on</span>
                    Waypoint Sequence
                </label>
                <ul class="flex flex-col gap-2 p-4 bg-surface-container-low rounded-xl min-h-[120px] transition-all border-2 border-dashed border-outline-variant/30 no-scrollbar overflow-y-auto max-h-[40vh]" id="stop-list">
                    <li class="flex flex-col items-center justify-center h-full text-center py-6 text-on-surface-variant/60" id="empty-state">
                        <span class="material-symbols-outlined text-3xl mb-2">add_location_alt</span>
                        <p class="text-sm px-4">Click on the map or search to drop up to 10 route stops.</p>
                    </li>
                </ul>
            </div>

            <div class="space-y-3">
                <button class="group relative w-full h-12 bg-gradient-to-br from-primary to-primary-container text-white font-semibold rounded-lg overflow-hidden flex items-center justify-center transition-all active:scale-[0.98] shadow-lg shadow-primary/20" type="submit" id="btn-optimize">
                    <div class="btn-content flex items-center gap-2">
                        <span class="material-symbols-outlined text-xl">rocket_launch</span>
                        <span>Optimize Route</span>
                    </div>
                </button>

                <button class="w-full h-11 border-2 border-outline-variant/50 text-on-surface-variant font-medium rounded-lg hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2" type="button" id="clear-pins-btn">
                    <span class="material-symbols-outlined text-lg">delete_sweep</span>
                    Clear Pins
                </button>
            </div>
        </form>

        <!-- Skeleton Loader (HTMX Indicator) -->
        <div id="loading-skeleton" class="htmx-indicator w-full space-y-4">
            <div class="h-6 w-1/3 bg-gray-200 rounded animate-pulse"></div>
            <div class="space-y-3">
                <div class="h-16 w-full bg-gray-200 rounded-xl animate-pulse"></div>
                <div class="h-16 w-full bg-gray-200 rounded-xl animate-pulse"></div>
                <div class="h-16 w-full bg-gray-200 rounded-xl animate-pulse"></div>
            </div>
        </div>

        <!-- Results container (HTMX swaps content here) -->
        <div class="mt-2 border-t border-surface-variant pt-6 hidden transition-all" id="results-container">
        </div>
    </div>
</main>

<!-- ═══════════════════════════════════════════════════════════════
     Vanilla JS — Leaflet Map Controller
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function() {
    'use strict';

    // ── Constants ──────────────────────────────────────────────
    const MAX_STOPS = 10;
    const COLOMBO = [6.9271, 79.8612];
    const DEFAULT_ZOOM = 8;
    const TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const TILE_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';

    // ── State ──────────────────────────────────────────────────
    let markers = [];
    let stopCount = 0;
    let routePolyline = null;
    let optimizedMarkers = [];

    // ── Initialize Map ─────────────────────────────────────────
    const map = L.map('map', {
        center: COLOMBO,
        zoom: DEFAULT_ZOOM,
        zoomControl: false
    });

    L.tileLayer(TILE_URL, {
        attribution: TILE_ATTR,
        maxZoom: 19
    }).addTo(map);

    // Position zoom control on right side
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ── DOM References ─────────────────────────────────────────
    const stopList     = document.getElementById('stop-list');
    const emptyState   = document.getElementById('empty-state');
    const clearBtn     = document.getElementById('clear-pins-btn');
    const resultsDiv   = document.getElementById('results-container');
    const searchInput  = document.getElementById('search-input');

    // ── Custom marker icon ─────────────────────────────────────
    function createMarkerIcon(number) {
        return L.divIcon({
            className: 'custom-marker',
            html: `<div style="
                width: 32px; height: 32px;
                background: linear-gradient(135deg, #005bbf, #1a73e8);
                border: 3px solid #fff;
                border-radius: 50%;
                display: flex; align-items: center; justify-content: center;
                color: #fff; font-weight: 700; font-size: 13px;
                font-family: 'Inter', sans-serif;
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                animation: markerPulse 2s ease-in-out 1;
            ">${number}</div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });
    }

    // Optimized route marker (green)
    function createOptimizedIcon(number) {
        return L.divIcon({
            className: 'custom-marker',
            html: `<div style="
                width: 32px; height: 32px;
                background: linear-gradient(135deg, #0f9d58, #34a853);
                border: 3px solid #fff;
                border-radius: 50%;
                display: flex; align-items: center; justify-content: center;
                color: #fff; font-weight: 700; font-size: 13px;
                font-family: 'Inter', sans-serif;
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            ">${number}</div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });
    }

    // ── Add Stop ───────────────────────────────────────────────
    function addStop(lat, lng, label) {
        if (stopCount >= MAX_STOPS) return;

        stopCount++;
        const coordStr = lat.toFixed(6) + ', ' + lng.toFixed(6);
        const displayLabel = label || coordStr;

        // Hide empty state
        emptyState.style.display = 'none';

        // Drop marker on map
        const marker = L.marker([lat, lng], {
            icon: createMarkerIcon(stopCount)
        }).addTo(map);
        marker.bindPopup(`<b>Stop ${stopCount}</b><br>${displayLabel}`);
        markers.push(marker);

        // Create list item + hidden input
        const li = document.createElement('li');
        li.className = 'stop-item flex items-center gap-3 py-2 px-3 bg-white rounded-lg shadow-sm border border-outline-variant/20';
        li.innerHTML = `
            <div class="flex items-center justify-center w-7 h-7 rounded-full bg-primary text-white text-xs font-bold shrink-0">${stopCount}</div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-on-surface truncate">${displayLabel}</p>
                <p class="text-[11px] text-on-surface-variant">${coordStr}</p>
            </div>
            <button type="button" class="remove-stop shrink-0 w-7 h-7 flex items-center justify-center text-on-surface-variant/50 hover:text-error hover:bg-error-container rounded-full transition-colors" data-index="${stopCount - 1}">
                <span class="material-symbols-outlined text-base">close</span>
            </button>
            <input type="hidden" name="stop" value="${coordStr}"/>
        `;
        stopList.appendChild(li);

        // Remove stop handler
        li.querySelector('.remove-stop').addEventListener('click', function() {
            removeStop(parseInt(this.dataset.index));
        });
    }

    // ── Remove Stop ────────────────────────────────────────────
    function removeStop(index) {
        // Remove marker from map
        if (markers[index]) {
            map.removeLayer(markers[index]);
        }
        markers.splice(index, 1);
        stopCount--;

        // Rebuild the list
        rebuildStopList();
        clearRoute();
    }

    // ── Rebuild Stop List (after removal) ──────────────────────
    function rebuildStopList() {
        // Remove all stop items (keep empty state)
        const items = stopList.querySelectorAll('.stop-item');
        items.forEach(item => item.remove());

        if (markers.length === 0) {
            emptyState.style.display = 'flex';
            return;
        }

        // Re-add all stops with updated numbering
        markers.forEach((marker, i) => {
            const latlng = marker.getLatLng();
            marker.setIcon(createMarkerIcon(i + 1));
            marker.setPopupContent(`<b>Stop ${i + 1}</b><br>${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`);

            const coordStr = latlng.lat.toFixed(6) + ', ' + latlng.lng.toFixed(6);
            const li = document.createElement('li');
            li.className = 'stop-item flex items-center gap-3 py-2 px-3 bg-white rounded-lg shadow-sm border border-outline-variant/20';
            li.innerHTML = `
                <div class="flex items-center justify-center w-7 h-7 rounded-full bg-primary text-white text-xs font-bold shrink-0">${i + 1}</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-on-surface truncate">${coordStr}</p>
                    <p class="text-[11px] text-on-surface-variant">${coordStr}</p>
                </div>
                <button type="button" class="remove-stop shrink-0 w-7 h-7 flex items-center justify-center text-on-surface-variant/50 hover:text-error hover:bg-error-container rounded-full transition-colors" data-index="${i}">
                    <span class="material-symbols-outlined text-base">close</span>
                </button>
                <input type="hidden" name="stop" value="${coordStr}"/>
            `;
            stopList.appendChild(li);

            li.querySelector('.remove-stop').addEventListener('click', function() {
                removeStop(parseInt(this.dataset.index));
            });
        });
    }

    // ── Map Click Listener ─────────────────────────────────────
    map.on('click', function(e) {
        if (stopCount >= MAX_STOPS) return;
        addStop(e.latlng.lat, e.latlng.lng);
    });

    // ── Clear Button ───────────────────────────────────────────
    clearBtn.addEventListener('click', function() {
        // Remove all markers
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        stopCount = 0;

        // Clear route
        clearRoute();

        // Reset stop list
        const items = stopList.querySelectorAll('.stop-item');
        items.forEach(item => item.remove());
        emptyState.style.display = 'flex';

        // Hide results
        resultsDiv.classList.add('hidden');
        resultsDiv.innerHTML = '';
    });

    // ── Clear Route Drawing ────────────────────────────────────
    function clearRoute() {
        if (routePolyline) {
            map.removeLayer(routePolyline);
            routePolyline = null;
        }
        optimizedMarkers.forEach(m => map.removeLayer(m));
        optimizedMarkers = [];
    }

    // ── Draw Optimized Route (called by backend response) ─────
    window.drawOptimizedRoute = function(routeData, geometry) {
        clearRoute();

        if (!routeData || routeData.length === 0) return;

        // Remove original blue markers
        markers.forEach(m => map.removeLayer(m));

        // Draw green optimized markers at stop coordinates
        const stopLatLngs = [];
        routeData.forEach(function(point, i) {
            const ll = [point.lat, point.lng];
            stopLatLngs.push(ll);

            const marker = L.marker(ll, {
                icon: createOptimizedIcon(i + 1)
            }).addTo(map);

            const label = point.label || ('Stop ' + (i + 1));
            marker.bindPopup(`<b>#${i + 1} — ${label}</b><br>${point.lat.toFixed(6)}, ${point.lng.toFixed(6)}`);
            optimizedMarkers.push(marker);
        });

        // Determine polyline path: use detailed road geometry if available,
        // otherwise fall back to straight lines between stops
        let polylinePath;
        if (geometry && geometry.length > 0) {
            // geometry is an array of [lat, lng] pairs from GraphHopper
            polylinePath = geometry.map(function(pt) { return [pt[0], pt[1]]; });
        } else {
            polylinePath = stopLatLngs;
        }

        // Draw main polyline (road path)
        routePolyline = L.polyline(polylinePath, {
            color: '#1a73e8',
            weight: 5,
            opacity: 0.85,
            smoothFactor: 1,
            lineCap: 'round',
            lineJoin: 'round'
        }).addTo(map);

        // Add animated direction arrows via a dashed overlay
        L.polyline(polylinePath, {
            color: '#ffffff',
            weight: 2,
            opacity: 0.5,
            dashArray: '10, 20',
            smoothFactor: 1
        }).addTo(map);

        // Fit map bounds to the route
        const bounds = L.latLngBounds(polylinePath);
        map.fitBounds(bounds, { padding: [60, 60] });

        // Show results container
        resultsDiv.classList.remove('hidden');
    };

    // ── Search Input (geocode via Photon) ──────────────────────
    let searchTimeout = null;
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;
            if (stopCount >= MAX_STOPS) return;

            geocodeAndAdd(query);
        }
    });

    function geocodeAndAdd(query) {
        const url = 'https://photon.komoot.io/api/?q=' + encodeURIComponent(query) + '&limit=1';
        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.features && data.features.length > 0) {
                    const coords = data.features[0].geometry.coordinates;
                    const lng = coords[0];
                    const lat = coords[1];
                    const name = data.features[0].properties.name || query;
                    addStop(lat, lng, name);
                    searchInput.value = '';
                    map.setView([lat, lng], 12);
                } else {
                    alert('Location not found: ' + query);
                }
            })
            .catch(err => {
                console.error('Geocoding error:', err);
                alert('Geocoding failed. Check your connection.');
            });
    }

    // ── HTMX: Show results container after swap ────────────────
    document.body.addEventListener('htmx:afterSwap', function(e) {
        if (e.detail.target.id === 'results-container') {
            resultsDiv.classList.remove('hidden');
        }
    });

    // ── Vanilla JS: Bottom Sheet Swipe Logic ───────────────────
    const bottomSheet = document.getElementById('bottom-sheet');
    const dragHandle = document.getElementById('drag-handle');
    let startY = 0;
    let currentY = 0;
    let isDragging = false;
    // We snap the sheet out of view (e.g. translate down 30vh) if pulled far enough
    const SNAP_THRESHOLD = 80; // pixels swiped down to trigger snap

    if (dragHandle && window.innerWidth < 768) { // Only active on mobile
        dragHandle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
            bottomSheet.style.transition = 'none'; // remove animation while dragging
        }, { passive: true });

        dragHandle.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            let deltaY = currentY - startY;

            // Only allow dragging down (or up to 0 if we were minimized but we handle snap on end)
            if (bottomSheet.dataset.minimized === "true") {
                // If minimized, pulling up is negative delta
                if (deltaY < 0) {
                    bottomSheet.style.transform = `translateY(calc(30vh + ${deltaY}px))`;
                }
            } else {
                // Not minimized, pull down is positive delta
                if (deltaY > 0) {
                    bottomSheet.style.transform = `translateY(${deltaY}px)`;
                }
            }
        }, { passive: true });

        dragHandle.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            bottomSheet.style.transition = 'transform 0.3s ease-out'; // restore animation

            let deltaY = currentY - startY;

            if (bottomSheet.dataset.minimized === "true") {
                // If minimized and pulled up past halfway
                if (deltaY < -SNAP_THRESHOLD) {
                    bottomSheet.style.transform = 'translateY(0)';
                    bottomSheet.dataset.minimized = "false";
                } else {
                    bottomSheet.style.transform = 'translateY(30vh)'; // Snap back to min
                }
            } else {
                // If normal and pulled down past halfway
                if (deltaY > SNAP_THRESHOLD) {
                    bottomSheet.style.transform = 'translateY(30vh)'; // Hide 30vh of height
                    bottomSheet.dataset.minimized = "true";
                } else {
                    bottomSheet.style.transform = 'translateY(0)'; // Snap back up
                }
            }
        });
    }

})();
</script>
</body>
</html>
