<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Deca-Node: Delivery Route Optimization using TSP solver">
    <title>Deca-Node — Route Optimizer</title>

    <!-- HTMX via CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        /* ── Reset & Base ──────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary:   #0f1117;
            --bg-surface:   #1a1d27;
            --bg-card:      #222636;
            --border:       #2e3348;
            --text-primary: #e8eaed;
            --text-muted:   #9aa0b4;
            --accent:       #6c63ff;
            --accent-hover: #7f78ff;
            --accent-glow:  rgba(108, 99, 255, 0.25);
            --success:      #34d399;
            --warning:      #fbbf24;
            --error:        #f87171;
            --radius:       12px;
            --transition:   0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ── Layout ────────────────────────────────────────── */
        .app-container {
            max-width: 860px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding: 2rem 0;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* ── Card ──────────────────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
            margin-bottom: 1.5rem;
        }

        .card h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
        }

        /* ── Stop Input Grid ──────────────────────────────── */
        .stop-grid {
            display: grid;
            gap: 0.65rem;
        }

        .stop-row {
            display: grid;
            grid-template-columns: 36px 1fr;
            gap: 0.6rem;
            align-items: center;
        }

        .stop-row .stop-num {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            text-align: center;
            background: var(--accent-glow);
            border-radius: 8px;
            padding: 0.35rem 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.6rem 0.85rem;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ── Buttons ───────────────────────────────────────── */
        .actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.7rem 1.6rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: #fff;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-hover), #9b7cf6);
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        /* ── HTMX Loading Indicator ────────────────────────── */
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Result Area ───────────────────────────────────── */
        #result-area {
            min-height: 60px;
        }

        .result-card {
            padding: 1.5rem;
            border-radius: var(--radius);
            animation: fadeSlideUp 0.35s ease-out;
        }

        .result-success {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .result-error {
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.25);
        }

        .result-card h3 { margin-bottom: 0.5rem; font-size: 1.05rem; }
        .result-card p  { color: var(--text-muted); font-size: 0.9rem; }

        /* ── Metrics Row ───────────────────────────────────── */
        .metrics-row {
            display: flex;
            gap: 1.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .metric {
            display: flex;
            flex-direction: column;
            padding: 0.75rem 1.25rem;
            background: var(--bg-surface);
            border-radius: 8px;
            border: 1px solid var(--border);
            min-width: 100px;
        }

        .metric-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Tables ────────────────────────────────────────── */
        .coord-table {
            width: 100%;
            margin-top: 1rem;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .coord-table th,
        .coord-table td {
            padding: 0.5rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .coord-table th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hint {
            margin-top: 1rem;
            font-style: italic;
            opacity: 0.7;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Footer ────────────────────────────────────────── */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 3rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="app-container">

    <header>
        <h1>📦 Deca-Node</h1>
        <p>Delivery Route Optimization — TSP Solver</p>
    </header>

    <!-- ── Stop Input Form ──────────────────────────────────── -->
    <div class="card">
        <h2>📍 Enter Delivery Stops</h2>
        <p class="subtitle">Enter coordinates (e.g. <code>6.9271, 79.8612</code>) or an address (e.g. <code>Lotus Tower, Colombo</code>)</p>

        <form id="route-form"
              hx-post="/route"
              hx-target="#result-area"
              hx-swap="innerHTML"
              hx-indicator="#loading-indicator">

            <div class="stop-grid">
                <div class="stop-row">
                    <span class="stop-num">1</span>
                    <input type="text" name="stop_1" placeholder="Lat, Lng  or  Address" id="stop-1">
                </div>
                <div class="stop-row">
                    <span class="stop-num">2</span>
                    <input type="text" name="stop_2" placeholder="Lat, Lng  or  Address" id="stop-2">
                </div>
                <div class="stop-row">
                    <span class="stop-num">3</span>
                    <input type="text" name="stop_3" placeholder="Lat, Lng  or  Address" id="stop-3">
                </div>
                <div class="stop-row">
                    <span class="stop-num">4</span>
                    <input type="text" name="stop_4" placeholder="Lat, Lng  or  Address" id="stop-4">
                </div>
                <div class="stop-row">
                    <span class="stop-num">5</span>
                    <input type="text" name="stop_5" placeholder="Lat, Lng  or  Address" id="stop-5">
                </div>
                <div class="stop-row">
                    <span class="stop-num">6</span>
                    <input type="text" name="stop_6" placeholder="Lat, Lng  or  Address" id="stop-6">
                </div>
                <div class="stop-row">
                    <span class="stop-num">7</span>
                    <input type="text" name="stop_7" placeholder="Lat, Lng  or  Address" id="stop-7">
                </div>
                <div class="stop-row">
                    <span class="stop-num">8</span>
                    <input type="text" name="stop_8" placeholder="Lat, Lng  or  Address" id="stop-8">
                </div>
                <div class="stop-row">
                    <span class="stop-num">9</span>
                    <input type="text" name="stop_9" placeholder="Lat, Lng  or  Address" id="stop-9">
                </div>
                <div class="stop-row">
                    <span class="stop-num">10</span>
                    <input type="text" name="stop_10" placeholder="Lat, Lng  or  Address" id="stop-10">
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary" id="btn-optimize">
                    Optimize Route
                </button>
                <button type="reset" class="btn btn-ghost" id="btn-reset">
                    Clear All
                </button>
                <span id="loading-indicator" class="htmx-indicator">
                    <span class="spinner"></span>
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Optimizing route…</span>
                </span>
            </div>
        </form>
    </div>

    <!-- ── Result Area (HTMX swaps content here) ──────────── -->
    <div id="result-area"></div>

    <footer>
        Deca-Node &bull; Sprint 3 &bull; Go + HTMX + GraphHopper + jsprit
    </footer>

</div>

</body>
</html>
