version: "3.9"

services:
  # ── Go Orchestrator ──────────────────────────────────────
  go-orchestrator:
    build:
      context: ./go-orchestrator
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped

