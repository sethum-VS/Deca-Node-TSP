name: CI — Build & Validate

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  # ════════════════════════════════════════════════════════
  # Build Java Routing Engine (compile only, no Docker)
  # ════════════════════════════════════════════════════════
  build-java:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: java-routing-engine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile & package (skip tests)
        run: mvn clean package -DskipTests -q

      - name: Verify JAR was created
        run: ls -lh target/*.jar

  # ════════════════════════════════════════════════════════
  # Build Go Orchestrator (compile only, no Docker)
  # ════════════════════════════════════════════════════════
  build-go:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: go-orchestrator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-orchestrator/go.mod

      - name: Build all packages
        run: go build ./...

      - name: Run vet (static analysis)
        run: go vet ./...
