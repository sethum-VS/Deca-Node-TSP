name: Build & Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-portfolio
  AZURE_CONTAINER_APP_JAVA: ca-deca-java
  AZURE_CONTAINER_APP_GO: ca-deca-go
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME_JAVA: ghcr.io/sethum-vs/deca-java
  IMAGE_NAME_GO: ghcr.io/sethum-vs/deca-go

jobs:
  # ===========================================================================
  #  JOB 1: Build & Push Java Routing Engine (GraphHopper)
  # ===========================================================================
  build-and-push-java:
    name: Build & Push Java Engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_JAVA }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Java Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./java-routing-engine
          file: ./java-routing-engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  #  JOB 2: Build & Push Go Orchestrator
  # ===========================================================================
  build-and-push-go:
    name: Build & Push Go Orchestrator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_GO }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Go Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./go-orchestrator
          file: ./go-orchestrator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  #  JOB 3: Deploy to Azure Container Apps
  # ===========================================================================
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build-and-push-java, build-and-push-go]
    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure GHCR credentials in Container Apps
        run: |
          az containerapp registry set \
            --name "${{ env.AZURE_CONTAINER_APP_JAVA }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ env.IMAGE_REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"
          az containerapp registry set \
            --name "${{ env.AZURE_CONTAINER_APP_GO }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ env.IMAGE_REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

      - name: Deploy Java Engine
        run: |
          az containerapp update \
            --name "${{ env.AZURE_CONTAINER_APP_JAVA }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_NAME_JAVA }}:${{ needs.build-and-push-java.outputs.image-tag }}"

      - name: Deploy Go Orchestrator
        run: |
          az containerapp update \
            --name "${{ env.AZURE_CONTAINER_APP_GO }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_NAME_GO }}:${{ needs.build-and-push-go.outputs.image-tag }}"

      - name: Get deployed app URL
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.AZURE_CONTAINER_APP_GO }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "🚀 Deployed to: https://${FQDN}"
          echo "FQDN=https://${FQDN}" >> "$GITHUB_STEP_SUMMARY"
